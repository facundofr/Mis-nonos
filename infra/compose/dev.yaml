# Servicios de desarrollo. Solo para la máquina local: las contraseñas de
# este archivo no se usan en ningún otro entorno.
name: residencia360-dev

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: residencia360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      # Roles que crea db/init/01-roles.sh (sección 10.13).
      R360_OWNER_PASSWORD: owner_dev
      R360_APP_PASSWORD: app_dev
      R360_WORKER_PASSWORD: worker_dev
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      # Solo accesible desde esta máquina. Puerto 5436 para no chocar con
      # otros PostgreSQL locales (el 5432 suele estar ocupado).
      - "127.0.0.1:5436:5432"
    volumes:
      # PostgreSQL 18 guarda los datos en /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d residencia360"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Atrapa los emails de desarrollo: no salen a internet. Se ven en
  # http://localhost:8025 (SMTP en el puerto 1025).
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
