<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Turnos y guardias — fase 5</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px">
    <a href="MovilEmpleados.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Turnos y guardias</span>
    <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; margin-right: 6px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 5</span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">Semana del 20 al 26 de octubre</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 11px">{{d.dow}}</span><span style="font-size: 16px; font-weight: 600">{{d.num}}</span></button>
      </sc-for>
    </div>

    <sc-for list="{{shifts}}" as="s" hint-placeholder-count="3">
      <section style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">{{s.name}}</span><span style="font-size: 13px; color: {{t.mutedFg}}">{{s.hours}}</span></div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{s.people}}" as="p" hint-placeholder-count="3">
            <span style="height: 30px; padding: 0 10px; border-radius: 999px; background: {{t.secondary}}; color: {{t.secondaryFg}}; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500">{{p}}</span>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 52px; border-radius: 12px; border: 0; background: {{t.primary}}; color: {{t.primaryFg}}; font: 600 16px 'Geist', sans-serif">Registrar entrada · 05:58</button>
      <span style="font-size: 12px; color: {{t.mutedFg}}; text-align: center">La asistencia queda registrada con tu usuario y la hora del servidor.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: 25 };
}
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', secondary: '#E8F1EE', secondaryFg: '#145A52', infoBg: '#EFF4FF', infoFg: '#1849A9' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', secondary: '#183A34', secondaryFg: '#8FD9CB', infoBg: '#102A56', infoFg: '#84ADFF' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
const base = 'height: 56px; border-radius: 12px; font-family: Geist, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ';
const days = [['Lu', 20], ['Ma', 21], ['Mi', 22], ['Ju', 23], ['Vi', 24], ['Sá', 25], ['Do', 26]].map(([dow, num]) => ({
dow, num,
pressed: this.state.day === num ? 'true' : 'false',
style: this.state.day === num ? base + 'border: 0; background: ' + t.primary + '; color: ' + t.primaryFg + ';' : base + 'border: 1px solid ' + t.border + '; background: ' + t.card + '; color: ' + t.fg + ';',
pick: () => this.setState({ day: num })
}));
const odd = this.state.day % 2 === 1;
return {
t, days,
shifts: [
{ name: 'Mañana', hours: '06–14 h', people: odd ? ['Laura P. · Enf.', 'Marta G.', 'Jorge S.'] : ['Laura P. · Enf.', 'Sofía M.', 'Hugo P.'] },
{ name: 'Tarde', hours: '14–22 h', people: ['Carla D. · Enf.', 'Ezequiel R.', 'Nadia F.'] },
{ name: 'Noche', hours: '22–06 h', people: odd ? ['Marta G.', 'Ramón L. · Enf.'] : ['Ramón L. · Enf.', 'Iván T.'] }
]
};
}
}
</script>
</body>
</html>
