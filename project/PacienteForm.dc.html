<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo paciente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px; border-bottom: 1px solid {{t.border}}">
    <a href="MovilPacientes.dc.html" aria-label="Cancelar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Nuevo paciente</span>
    <span style="width: 44px"></span>
  </header>

  <form style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px">
    <div style="display: flex; align-items: center; gap: 14px">
      <button type="button" aria-label="Agregar foto" style="width: 64px; height: 64px; border-radius: 999px; border: 1.5px dashed {{t.border}}; background: {{t.card}}; color: {{t.mutedFg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
      <span style="font-size: 13px; color: {{t.mutedFg}}">Foto opcional, solo con autorización del paciente o su referente.</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-nom" style="font-size: 14px; font-weight: 500">Nombre *</label><input id="pf-nom" type="text" value="Elena" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-ape" style="font-size: 14px; font-weight: 500">Apellido *</label><input id="pf-ape" type="text" value="Ramos" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-dni" style="font-size: 14px; font-weight: 500">DNI</label><input id="pf-dni" type="text" inputmode="numeric" value="4.512.778" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-nac" style="font-size: 14px; font-weight: 500">Nacimiento</label><input id="pf-nac" type="text" value="14/03/1942" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-hab" style="font-size: 14px; font-weight: 500">Habitación</label><input id="pf-hab" type="text" value="12" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-ing" style="font-size: 14px; font-weight: 500">Ingreso</label><input id="pf-ing" type="text" value="02/06/2024" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-cob" style="font-size: 14px; font-weight: 500">Cobertura</label><select id="pf-cob" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 10px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"><option>PAMI</option><option>Obra social</option><option>Prepaga</option><option>Sin cobertura</option></select></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-afi" style="font-size: 14px; font-weight: 500">N.º afiliado</label><input id="pf-afi" type="text" value="15-0452778-0-00" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 500">Alergias</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="height: 34px; padding: 0 6px 0 12px; border-radius: 999px; background: {{t.dangerBg}}; color: {{t.dangerText}}; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px">Penicilina<button type="button" aria-label="Quitar penicilina" style="width: 28px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed {{t.border}}; background: transparent; color: {{t.fg}}; font: 500 14px 'Geist', sans-serif">+ Agregar alergia</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-med" style="font-size: 14px; font-weight: 500">Médico de cabecera</label><input id="pf-med" type="text" value="Dra. Paula Giménez · 11 4789-2201" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}"></div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf-ind" style="font-size: 14px; font-weight: 500">Indicaciones especiales</label><input id="pf-ind" type="text" value="Dieta de textura blanda" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}"></div>
  </form>

  <footer style="padding: 12px 20px 20px; border-top: 1px solid {{t.border}}; display: flex; gap: 10px">
    <a href="ContactoForm.dc.html" style="flex: 1; height: 52px; border-radius: 12px; border: 1px solid {{t.border}}; color: {{t.fg}}; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">+ Contactos</a>
    <a href="MovilFicha.dc.html" style="flex: 1.4; height: 52px; border-radius: 12px; background: {{t.primary}}; color: {{t.primaryFg}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Guardar paciente</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', dangerBg: '#FEF3F2', dangerText: '#B42318' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', dangerBg: '#3A1512', dangerText: '#FDA29B' }
};
const theme = this.props.theme === 'dark' ? 'dark' : 'light';
return { t: T[theme] };
}
}
</script>
</body>
</html>
