<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Más — móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 16px; overflow: hidden">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Más</h1>

    <div style="display: flex; align-items: center; gap: 14px; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 14px">
      <div style="width: 52px; height: 52px; border-radius: 999px; background: {{t.primary}}; color: {{t.primaryFg}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">LP</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Laura Pereyra</span><span style="font-size: 14px; color: {{t.mutedFg}}">Enfermería · Turno mañana</span></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <div style="display: flex; flex-direction: column; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; overflow: hidden">
      <a href="MovilEmpleados.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 14px; color: {{t.fg}}; text-decoration: none; border-bottom: 1px solid {{t.border}}">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.secondary}}; color: {{t.secondaryFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 500">Empleados</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a href="MovilUsuarios.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 14px; color: {{t.fg}}; text-decoration: none; border-bottom: 1px solid {{t.border}}">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.secondary}}; color: {{t.secondaryFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4M19 14v6M16 17h6"/></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 500">Usuarios y roles</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a href="MovilConfig.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 14px; color: {{t.fg}}; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.secondary}}; color: {{t.secondaryFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 500">Configuración</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.mutedFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: {{t.mutedFg}}; text-transform: uppercase; letter-spacing: 0.06em">Apariencia</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: {{t.muted}}; border-radius: 12px; padding: 4px; gap: 4px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: {{t.mutedFg}}">"Sistema" sigue la configuración del teléfono. El modo oscuro cansa menos la vista en el turno noche.</span>
    </fieldset>

    <a href="Login.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.dangerText}}; font-size: 16px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</a>
  </div>

  <dc-import name="TabBar" active="mas" theme="{{theme}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: null };
}
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', muted: '#EBF0EE', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', secondary: '#E8F1EE', secondaryFg: '#145A52', dangerText: '#B42318' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', muted: '#1C2724', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', secondary: '#183A34', secondaryFg: '#8FD9CB', dangerText: '#FDA29B' }
};
const propTheme = this.props.theme === 'dark' ? 'dark' : 'light';
const mode = this.state.mode ?? propTheme;
const theme = mode === 'dark' ? 'dark' : 'light';
const t = T[theme];
const base = 'height: 40px; border: 0; border-radius: 9px; font: 500 14px Geist, sans-serif; ';
const modes = [['light', 'Claro'], ['dark', 'Oscuro'], ['system', 'Sistema']].map(([key, label]) => ({
label,
pressed: mode === key ? 'true' : 'false',
style: mode === key ? base + 'background: ' + t.card + '; color: ' + t.fg + '; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12);' : base + 'background: transparent; color: ' + t.mutedFg + ';',
pick: () => this.setState({ mode: key })
}));
return { t, theme, modes };
}
}
</script>
</body>
</html>
