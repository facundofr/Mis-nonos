<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Habitaciones y camas — fase 7</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px">
    <a href="MovilMas.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Habitaciones y camas</span>
    <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; margin-right: 6px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 7</span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">90%</span><span style="font-size: 12px; color: {{t.mutedFg}}">Ocupación</span></div>
      <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">38/42</span><span style="font-size: 12px; color: {{t.mutedFg}}">Camas</span></div>
      <div style="background: {{t.okBg}}; color: {{t.okFg}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">4</span><span style="font-size: 12px">Libres</span></div>
    </div>

    <div role="tablist" aria-label="Piso" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: {{t.muted}}; border-radius: 12px; padding: 4px; gap: 4px">
      <button type="button" role="tab" aria-selected="true" style="height: 38px; border: 0; border-radius: 9px; background: {{t.card}}; color: {{t.fg}}; font: 600 14px 'Geist', sans-serif">Planta baja</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; color: {{t.mutedFg}}; font: 500 14px 'Geist', sans-serif">Primer piso</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
        <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 600">Hab. {{r.n}}</span>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{r.beds}}" as="b" hint-placeholder-count="2">
              <span style="flex: 1; height: 40px; border-radius: 10px; border: {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{b.label}}</span>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: {{t.mutedFg}}"><span>■ Ocupada</span><span style="color: {{t.okFg}}">□ Libre</span><span style="color: {{t.infoFg}}">■ Internado fuera (cama reservada)</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', muted: '#EBF0EE', mutedFg: '#57625F', border: '#DFE6E3', secondary: '#E8F1EE', secondaryFg: '#145A52', infoBg: '#EFF4FF', infoFg: '#1849A9', okBg: '#ECFDF3', okFg: '#067647' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', muted: '#1C2724', mutedFg: '#9BA8A4', border: '#26332F', secondary: '#183A34', secondaryFg: '#8FD9CB', infoBg: '#102A56', infoFg: '#84ADFF', okBg: '#0B2E1E', okFg: '#47CD89' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
const occ = (label) => ({ label, bg: t.secondary, fg: t.secondaryFg, border: '0' });
const free = { label: 'Libre', bg: 'transparent', fg: t.okFg, border: '1.5px dashed ' + t.okFg };
const out = (label) => ({ label, bg: t.infoBg, fg: t.infoFg, border: '0' });
return {
t,
rooms: [
{ n: 3, beds: [occ('RM'), occ('NB')] },
{ n: 5, beds: [occ('JL'), free] },
{ n: 7, beds: [occ('HB'), occ('OM')] },
{ n: 9, beds: [out('CO'), occ('LT')] },
{ n: 11, beds: [occ('MS'), free] },
{ n: 12, beds: [occ('ER'), occ('GP')] }
]
};
}
}
</script>
</body>
</html>
