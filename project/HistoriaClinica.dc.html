<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historia clínica — fase 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px">
    <a href="MovilFicha.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 16px; font-weight: 600">Historia clínica</span><span style="font-size: 12px; color: {{t.mutedFg}}">Elena Ramos</span></div>
    <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; margin-right: 6px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 4</span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px">
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: {{t.fg}}; color: {{t.bg}}; display: inline-flex; align-items: center; font-size: 14px; font-weight: 500">Todo</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.border}}; display: inline-flex; align-items: center; font-size: 14px">Evoluciones</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.border}}; display: inline-flex; align-items: center; font-size: 14px">Antecedentes</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.border}}; display: inline-flex; align-items: center; font-size: 14px; white-space: nowrap">Estudios</span>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
        <li style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: {{t.secondary}}; color: {{t.secondaryFg}}">{{e.type}}</span>
            <span style="font-size: 12px; color: {{t.mutedFg}}">{{e.when}}</span>
          </div>
          <sc-if value="{{e.amend}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; color: {{t.warnFg}}">Enmienda de la evolución del {{e.amend}}</span></sc-if>
          <span style="font-size: 15px; line-height: 1.45">{{e.text}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{t.mutedFg}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>{{e.by}}</span>
        </li>
      </sc-for>
    </ol>
    <span style="font-size: 12px; color: {{t.mutedFg}}">Las evoluciones firmadas no se editan ni se borran: se corrigen con una enmienda que conserva el original.</span>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 52px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.card}}; color: {{t.fg}}; font: 500 15px 'Geist', sans-serif">Exportar PDF</button>
      <button type="button" style="height: 52px; border-radius: 12px; border: 0; background: {{t.primary}}; color: {{t.primaryFg}}; font: 600 15px 'Geist', sans-serif">+ Evolución</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', secondary: '#E8F1EE', secondaryFg: '#145A52', infoBg: '#EFF4FF', infoFg: '#1849A9', warnFg: '#93370D' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', secondary: '#183A34', secondaryFg: '#8FD9CB', infoBg: '#102A56', infoFg: '#84ADFF', warnFg: '#FDB022' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
return {
t,
entries: [
{ type: 'Evolución médica', when: 'Hoy 11:20', amend: '', text: 'Control mensual. Lesión en talón derecho grado I. Indico cambios posturales cada 2 h y curación cada 48 h.', by: 'Dra. Paula Giménez · M.N. 104.552' },
{ type: 'Enfermería', when: 'Ayer 18:05', amend: '22/10', text: 'Corrige dato de peso: 61,4 kg (no 64,1 kg).', by: 'Laura Pereyra · Mat. 58.214' },
{ type: 'Kinesiología', when: '16/10 10:00', amend: '', text: 'Marcha con andador, mejor equilibrio. Continuar 3 veces por semana.', by: 'Lic. Tomás Ferrari · M.P. 7.031' }
]
};
}
}
</script>
</body>
</html>
