<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Legajo del empleado — fase 5</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px">
    <a href="MovilEmpleados.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Legajo</span>
    <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; margin-right: 6px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 5</span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 60px; height: 60px; border-radius: 999px; background: {{t.primary}}; color: {{t.primaryFg}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">LP</div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Laura Pereyra</span><span style="font-size: 14px; color: {{t.mutedFg}}">Enfermera · desde 03/2023 · Turno mañana</span></div>
    </div>

    <dl style="margin: 0; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: {{t.mutedFg}}">DNI</dt><dd style="margin: 0; font-size: 15px">30.118.442</dd></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: {{t.mutedFg}}">CUIL</dt><dd style="margin: 0; font-size: 15px">27-30118442-5</dd></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: {{t.mutedFg}}">Matrícula</dt><dd style="margin: 0; font-size: 15px">M.P. 58.214</dd></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: {{t.mutedFg}}">Usuario</dt><dd style="margin: 0; font-size: 15px">Enfermería · activo</dd></div>
    </dl>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.mutedFg}}; text-transform: uppercase; letter-spacing: 0.06em">Documentación</h2>
      <ul style="list-style: none; margin: 0; padding: 0; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; overflow: hidden">
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
          <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid {{t.border}}">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{d.name}}</span><span style="font-size: 12px; color: {{t.mutedFg}}">{{d.exp}}</span></span>
            <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: {{d.bg}}; color: {{d.fg}}; white-space: nowrap">{{d.state}}</span>
          </li>
        </sc-for>
      </ul>
    </section>

    <button type="button" style="margin-top: auto; height: 52px; border-radius: 12px; border: 0; background: {{t.primary}}; color: {{t.primaryFg}}; font: 600 16px 'Geist', sans-serif">Subir documento</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', infoBg: '#EFF4FF', infoFg: '#1849A9', okBg: '#ECFDF3', okFg: '#067647', warnBg: '#FEF4E6', warnFg: '#93370D', dangerBg: '#FEF3F2', dangerText: '#B42318' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', infoBg: '#102A56', infoFg: '#84ADFF', okBg: '#0B2E1E', okFg: '#47CD89', warnBg: '#3A2508', warnFg: '#FDB022', dangerBg: '#3A1512', dangerText: '#FDA29B' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
const d = (name, exp, s) => ({ name, exp, state: { ok: 'Vigente', soon: 'Vence pronto', bad: 'Vencido' }[s], bg: { ok: t.okBg, soon: t.warnBg, bad: t.dangerBg }[s], fg: { ok: t.okFg, soon: t.warnFg, bad: t.dangerText }[s] });
return {
t,
docs: [
d('Matrícula profesional', 'Vence 12/2027', 'ok'),
d('Libreta sanitaria', 'Vence en 12 días · 06/11/2026', 'soon'),
d('Seguro / ART', 'Vigente hasta 03/2027', 'ok'),
d('Curso RCP', 'Venció el 01/10/2026', 'bad'),
d('Vacuna antigripal', 'Aplicada 04/2026', 'ok')
]
};
}
}
</script>
</body>
</html>
