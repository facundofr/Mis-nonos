<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Usuarios y roles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px">
    <a href="MovilMas.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Usuarios y roles</span>
    <span style="width: 44px"></span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
        <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 20px; font-weight: 600">{{r.n}}</span><span style="font-size: 11px; color: {{t.mutedFg}}; text-align: center">{{r.label}}</span></div>
      </sc-for>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; overflow: hidden">
      <sc-for list="{{users}}" as="u" hint-placeholder-count="5">
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid {{t.border}}; opacity: {{u.opacity}}">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 15px; font-weight: 500">{{u.name}}</span>
            <span style="font-size: 13px; color: {{t.mutedFg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{u.email}}</span>
            <div style="display: flex; gap: 6px"><span style="font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; border: 1px solid {{t.border}}">{{u.role}}</span><span style="font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; background: {{u.sBg}}; color: {{u.sFg}}">{{u.status}}</span></div>
          </div>
          <button type="button" aria-label="Opciones de {{u.name}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
        </li>
      </sc-for>
    </ul>

    <a href="InvitarUsuario.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: {{t.primary}}; color: {{t.primaryFg}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Invitar usuario</a>
  </div>
  <dc-import name="TabBar" active="mas" theme="{{theme}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', okBg: '#ECFDF3', okFg: '#067647', warnBg: '#FEF4E6', warnFg: '#93370D', offBg: '#EBF0EE', offFg: '#57625F' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', okBg: '#0B2E1E', okFg: '#47CD89', warnBg: '#3A2508', warnFg: '#FDB022', offBg: '#1C2724', offFg: '#9BA8A4' }
};
const theme = this.props.theme === 'dark' ? 'dark' : 'light';
const t = T[theme];
const st = { a: ['Activo', t.okBg, t.okFg, '1'], p: ['Invitación pendiente', t.warnBg, t.warnFg, '1'], d: ['Desactivado', t.offBg, t.offFg, '0.7'] };
const u = (name, email, role, s) => ({ name, email, role, status: st[s][0], sBg: st[s][1], sFg: st[s][2], opacity: st[s][3] });
return {
t, theme,
roles: [{ n: 2, label: 'Admin.' }, { n: 1, label: 'Dirección' }, { n: 6, label: 'Enfermería' }, { n: 15, label: 'Cuidado' }],
users: [
u('Rubén Castro', 'ruben@misnonos.com.ar', 'Dirección', 'a'),
u('Ana Villalba', 'ana@misnonos.com.ar', 'Administrador', 'a'),
u('Laura Pereyra', 'laura@misnonos.com.ar', 'Enfermería', 'a'),
u('Sofía Medina', 'sofia@misnonos.com.ar', 'Cuidador/a', 'p'),
u('Hugo Paz', 'hugo@misnonos.com.ar', 'Cuidador/a', 'd')
]
};
}
}
</script>
</body>
</html>
