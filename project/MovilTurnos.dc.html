<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Traspaso de turno — móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 12px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Traspaso de turno</h1>
      <span style="font-size: 14px; color: {{t.mutedFg}}">Mañana 06–14 h → Tarde 14–22 h</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 600">12</span><span style="font-size: 12px; color: {{t.mutedFg}}">Novedades</span></div>
      <div style="background: {{t.warnBg}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; color: {{t.warnFg}}"><span style="font-size: 24px; font-weight: 600">3</span><span style="font-size: 12px">Pendientes</span></div>
      <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 600">2</span><span style="font-size: 12px; color: {{t.mutedFg}}">Resueltas</span></div>
    </div>

    <section style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 4px 14px">
      <h2 style="margin: 0; padding: 10px 0 4px; font-size: 13px; font-weight: 600; color: {{t.mutedFg}}; text-transform: uppercase; letter-spacing: 0.06em">Quedan pendientes</h2>
      <sc-for list="{{pend}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid {{t.border}}">
          <span style="width: 8px; height: 8px; border-radius: 999px; background: {{t.warnFg}}; margin-top: 7px; flex-shrink: 0"></span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{p.who}}</span><span style="font-size: 14px">{{p.text}}</span></div>
        </div>
      </sc-for>
    </section>

    <section style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 4px 14px 8px">
      <h2 style="margin: 0; padding: 10px 0 4px; font-size: 13px; font-weight: 600; color: {{t.mutedFg}}; text-transform: uppercase; letter-spacing: 0.06em">Lo más importante del turno</h2>
      <label for="tr-nota" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nota para el turno entrante</label>
      <textarea id="tr-nota" rows="3" style="width: 100%; box-sizing: border-box; border: 1px solid {{t.border}}; border-radius: 10px; padding: 10px 12px; font: 15px/1.4 'Geist', sans-serif; color: {{t.fg}}; background: transparent; resize: none">Carlos Ojeda sigue internado. Héctor comió poco: mirar la cena.</textarea>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 52px; border-radius: 12px; border: 0; background: {{t.primary}}; color: {{t.primaryFg}}; font: 600 16px 'Geist', sans-serif">Entregar turno</button>
      <span style="font-size: 12px; color: {{t.mutedFg}}; text-align: center">El turno entrante confirma la recepción desde su teléfono.</span>
    </div>
  </div>
  <dc-import name="TabBar" active="turnos" theme="{{theme}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', warnBg: '#FEF4E6', warnFg: '#93370D' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', warnBg: '#3A2508', warnFg: '#FDB022' }
};
const theme = this.props.theme === 'dark' ? 'dark' : 'light';
return {
t: T[theme], theme,
pend: [
{ who: 'Héctor Benítez · Hab. 7', text: 'Comió poco. Avisar a la familia si repite.' },
{ who: 'Elena Ramos · Hab. 12', text: 'Revisar talón derecho en el cambio postural.' },
{ who: 'General', text: 'Reponer guantes en el office.' }
]
};
}
}
</script>
</body>
</html>
