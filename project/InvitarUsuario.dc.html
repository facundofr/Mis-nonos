<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Invitar usuario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px; border-bottom: 1px solid {{t.border}}">
    <a href="MovilUsuarios.dc.html" aria-label="Cancelar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Invitar usuario</span>
    <span style="width: 44px"></span>
  </header>

  <form style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px">
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="iu-nom" style="font-size: 14px; font-weight: 500">Nombre y apellido *</label><input id="iu-nom" type="text" value="Sofía Medina" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="iu-mail" style="font-size: 14px; font-weight: 500">Email *</label><input id="iu-mail" type="email" value="sofia@misnonos.com.ar" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="iu-tel" style="font-size: 14px; font-weight: 500">Teléfono</label><input id="iu-tel" type="tel" placeholder="Opcional" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="iu-mat" style="font-size: 14px; font-weight: 500">Matrícula</label><input id="iu-mat" type="text" placeholder="Si es profesional" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 12px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; min-width: 0"></div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 8px">Rol</legend>
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 15px; font-weight: 600">{{r.label}}</span><span style="font-size: 13px; color: {{t.mutedFg}}">{{r.desc}}</span></span>
        </button>
      </sc-for>
    </fieldset>
  </form>

  <footer style="padding: 12px 20px 20px; border-top: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 8px">
    <a href="MovilUsuarios.dc.html" style="height: 52px; border-radius: 12px; background: {{t.primary}}; color: {{t.primaryFg}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Enviar invitación</a>
    <span style="font-size: 12px; color: {{t.mutedFg}}; text-align: center">Recibe un email para crear su contraseña. El enlace vence en 72 h.</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { role: 'cuidado' };
}
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', secondary: '#E8F1EE' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', secondary: '#183A34' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
const base = 'width: 100%; min-height: 60px; padding: 10px 14px; border-radius: 12px; font-family: Geist, sans-serif; color: ' + t.fg + '; display: flex; align-items: center; ';
const roles = [
['cuidado', 'Cuidador/a', 'Pacientes, emergencia, novedades y turno'],
['enfermeria', 'Enfermería', 'Lo anterior + editar datos y contactos'],
['direccion', 'Dirección', 'Todo, actividad y reportes'],
['admin', 'Administrador', 'Usuarios, roles y configuración']
].map(([key, label, desc]) => ({
label, desc,
pressed: this.state.role === key ? 'true' : 'false',
style: this.state.role === key ? base + 'border: 1.5px solid ' + t.primary + '; background: ' + t.secondary + ';' : base + 'border: 1px solid ' + t.border + '; background: ' + t.card + ';',
pick: () => this.setState({ role: key })
}));
return { t, roles };
}
}
</script>
</body>
</html>
