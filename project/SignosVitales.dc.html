<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Signos vitales — fase 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px">
    <a href="MovilFicha.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 16px; font-weight: 600">Signos vitales</span><span style="font-size: 12px; color: {{t.mutedFg}}">Héctor Benítez</span></div>
    <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; margin-right: 6px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 2</span>
  </header>

  <form style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
        <div style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
          <label for="sv-{{f.id}}" style="font-size: 13px; color: {{t.mutedFg}}">{{f.label}}</label>
          <div style="display: flex; align-items: baseline; gap: 6px"><input id="sv-{{f.id}}" type="text" inputmode="decimal" value="{{f.value}}" style="width: 100%; min-width: 0; border: 0; padding: 0; background: transparent; font: 600 22px 'Geist', sans-serif; color: {{t.fg}}"><span style="font-size: 13px; color: {{t.mutedFg}}; white-space: nowrap">{{f.unit}}</span></div>
        </div>
      </sc-for>
    </div>

    <section style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 600">Presión sistólica · 7 días</span><span style="font-size: 12px; color: {{t.mutedFg}}">mmHg</span></div>
      <div role="img" aria-label="Presión sistólica de los últimos 7 días, entre 118 y 136 mmHg" style="height: 110px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 1px solid {{t.border}}">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 11px; color: {{t.mutedFg}}">{{b.v}}</span><div style="width: 100%; height: {{b.h}}px; border-radius: 6px 6px 0 0; background: {{b.c}}"></div></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: {{t.mutedFg}}"><span>19/10</span><span>Hoy</span></div>
      <span style="font-size: 12px; color: {{t.mutedFg}}">Rango de referencia definido por la Dra. Giménez: 100–140. El sistema no interpreta valores.</span>
    </section>

    <button type="button" style="margin-top: auto; height: 52px; border-radius: 12px; border: 0; background: {{t.primary}}; color: {{t.primaryFg}}; font: 600 16px 'Geist', sans-serif">Guardar control · 10:30</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', bar: '#9CC9C0', infoBg: '#EFF4FF', infoFg: '#1849A9' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', bar: '#2A6A5F', infoBg: '#102A56', infoFg: '#84ADFF' }
};
const theme = this.props.theme === 'dark' ? 'dark' : 'light';
const t = T[theme];
const vals = [124, 130, 118, 126, 136, 122, 128];
const bars = vals.map((v, i) => ({ v, h: Math.round((v - 90) * 1.7), c: i === vals.length - 1 ? t.primary : t.bar }));
return {
t,
fields: [
{ id: 'pa', label: 'Presión', value: '128/78', unit: 'mmHg' },
{ id: 'fc', label: 'Frec. cardíaca', value: '72', unit: 'lpm' },
{ id: 'tc', label: 'Temperatura', value: '36,4', unit: '°C' },
{ id: 'sat', label: 'Saturación', value: '96', unit: '%' },
{ id: 'glu', label: 'Glucemia', value: '', unit: 'mg/dl' },
{ id: 'peso', label: 'Peso', value: '', unit: 'kg' }
],
bars
};
}
}
</script>
</body>
</html>
