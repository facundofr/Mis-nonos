<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tareas — fase 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 12px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Tareas</h1>
        <span style="font-size: 14px; color: {{t.mutedFg}}">5 para tu turno · 1 vencida</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 2</span>
    </div>

    <div role="tablist" aria-label="Filtro" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: {{t.muted}}; border-radius: 12px; padding: 4px; gap: 4px">
      <button type="button" role="tab" aria-selected="true" style="height: 38px; border: 0; border-radius: 9px; background: {{t.card}}; color: {{t.fg}}; font: 600 14px 'Geist', sans-serif">Mías</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; color: {{t.mutedFg}}; font: 500 14px 'Geist', sans-serif">Del turno</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; color: {{t.mutedFg}}; font: 500 14px 'Geist', sans-serif">Hechas</button>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{tasks}}" as="k" hint-placeholder-count="5">
        <li style="display: flex; gap: 12px; align-items: flex-start; background: {{t.card}}; border: 1px solid {{k.border}}; border-radius: 14px; padding: 12px 14px">
          <input type="checkbox" aria-label="Marcar como hecha: {{k.title}}" style="width: 24px; height: 24px; margin: 2px 0 0; accent-color: {{t.primary}}; flex-shrink: 0">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 15px; font-weight: 500">{{k.title}}</span>
            <span style="font-size: 13px; color: {{t.mutedFg}}">{{k.who}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: {{k.dueBg}}; color: {{k.dueFg}}">{{k.due}}</span>
              <sc-if value="{{k.rec}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; border: 1px solid {{t.border}}">↻ {{k.rec}}</span></sc-if>
            </div>
          </div>
        </li>
      </sc-for>
    </ul>
  </div>
  <dc-import name="TabBar" active="novedades" theme="{{theme}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', muted: '#EBF0EE', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', infoBg: '#EFF4FF', infoFg: '#1849A9', dangerBg: '#FEF3F2', dangerText: '#B42318', dangerBorder: '#FECDCA', warnBg: '#FEF4E6', warnFg: '#93370D', offBg: '#EBF0EE', offFg: '#57625F' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', muted: '#1C2724', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', infoBg: '#102A56', infoFg: '#84ADFF', dangerBg: '#3A1512', dangerText: '#FDA29B', dangerBorder: '#5C211C', warnBg: '#3A2508', warnFg: '#FDB022', offBg: '#1C2724', offFg: '#9BA8A4' }
};
const theme = this.props.theme === 'dark' ? 'dark' : 'light';
const t = T[theme];
const k = (title, who, due, kind, rec) => ({ title, who, due, rec, dueBg: kind === 'late' ? t.dangerBg : kind === 'soon' ? t.warnBg : t.offBg, dueFg: kind === 'late' ? t.dangerText : kind === 'soon' ? t.warnFg : t.offFg, border: kind === 'late' ? t.dangerBorder : t.border });
return {
t, theme,
tasks: [
k('Cambio postural', 'Elena Ramos · Hab. 12', 'Vencida · 08:00', 'late', 'cada 2 h'),
k('Control de glucemia', 'Héctor Benítez · Hab. 7', 'En 20 min · 11:30', 'soon', 'diaria'),
k('Llamar a la familia por almuerzo', 'Héctor Benítez · Hab. 7', 'Antes de las 14:00', 'later', ''),
k('Curación talón derecho', 'Elena Ramos · Hab. 12', '12:00', 'later', 'cada 48 h'),
k('Reponer guantes del office', 'General', 'Hoy', 'later', '')
]
};
}
}
</script>
</body>
</html>
