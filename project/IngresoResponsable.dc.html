<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingreso 2 de 4 — Responsable y contactos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 12px; border-bottom: 1px solid {{t.border}}">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="IngresoPaciente.dc.html" aria-label="Paso anterior" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
      <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 16px; font-weight: 600">Nuevo ingreso</span><span style="font-size: 12px; color: {{t.mutedFg}}">Paso 2 de 4 · Responsable y contactos</span></div>
      <span style="width: 44px"></span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 12px">
      <span style="height: 4px; border-radius: 999px; background: {{t.primary}}"></span><span style="height: 4px; border-radius: 999px; background: {{t.primary}}"></span><span style="height: 4px; border-radius: 999px; background: {{t.muted}}"></span><span style="height: 4px; border-radius: 999px; background: {{t.muted}}"></span>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 14px 20px">
    <section style="background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Responsable de la internación</h2>
        <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: {{t.secondary}}; color: {{t.secondaryFg}}">Firma los papeles</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="ir-nom" style="font-size: 13px; font-weight: 500">Nombre y apellido</label><input id="ir-nom" type="text" value="Marcelo Rossi" style="height: 44px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 10px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: transparent; min-width: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="ir-par" style="font-size: 13px; font-weight: 500">Parentesco</label><select id="ir-par" style="height: 44px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 8px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: transparent; min-width: 0"><option>Hijo</option><option>Hija</option><option>Cónyuge</option><option>Otro</option></select></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="ir-dni" style="font-size: 13px; font-weight: 500">DNI</label><input id="ir-dni" type="text" inputmode="numeric" value="25.678.901" style="height: 44px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 10px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: transparent; min-width: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="ir-tel" style="font-size: 13px; font-weight: 500">Teléfono</label><input id="ir-tel" type="tel" value="11 4000-1111" style="height: 44px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 10px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: transparent; min-width: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px; grid-column: span 2"><label for="ir-dom" style="font-size: 13px; font-weight: 500">Domicilio</label><input id="ir-dom" type="text" value="[DOMICILIO DEL RESPONSABLE]" style="height: 44px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 10px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: transparent"></div>
      </div>
      <span style="font-size: 12px; color: {{t.mutedFg}}">+ Celular y teléfono laboral (opcionales)</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.mutedFg}}; text-transform: uppercase; letter-spacing: 0.06em">Llamar en este orden</h2><span style="font-size: 12px; color: {{t.mutedFg}}">Tocá ↑ para subir</span></div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 14px; overflow: hidden">
        <sc-for list="{{contacts}}" as="c" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 8px 0 14px; border-bottom: 1px solid {{t.border}}">
            <span style="width: 26px; height: 26px; border-radius: 999px; background: {{c.numBg}}; color: {{c.numFg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.n}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{c.name}}</span><span style="font-size: 13px; color: {{t.mutedFg}}">{{c.tel}}</span></span>
            <button type="button" aria-label="Subir a {{c.name}}" onClick="{{c.up}}" disabled="{{c.first}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: {{c.upColor}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
          </li>
        </sc-for>
      </ol>
      <a href="ContactoForm.dc.html" style="height: 44px; border-radius: 12px; border: 1px dashed {{t.border}}; color: {{t.primary}}; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">+ Agregar otro contacto</a>
    </section>
  </div>

  <footer style="padding: 12px 20px 20px; border-top: 1px solid {{t.border}}">
    <a href="IngresoDocumentos.dc.html" style="height: 52px; border-radius: 12px; background: {{t.primary}}; color: {{t.primaryFg}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Siguiente: documentación</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { order: ['m', 'l', 'p'] };
}
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', muted: '#EBF0EE', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', secondary: '#E8F1EE', secondaryFg: '#145A52' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', muted: '#1C2724', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', secondary: '#183A34', secondaryFg: '#8FD9CB' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
const data = { m: ['Marcelo Rossi · hijo (responsable)', '11 4000-1111'], l: ['Laura Rossi · hija', '11 4000-2222'], p: ['Pablo Rossi · hijo', '11 4000-3333'] };
const order = this.state.order;
const contacts = order.map((k, i) => ({
n: i + 1, name: data[k][0], tel: data[k][1],
numBg: i === 0 ? t.primary : t.secondary, numFg: i === 0 ? t.primaryFg : t.secondaryFg,
first: i === 0, upColor: i === 0 ? t.border : t.fg,
up: () => { if (i === 0) return; const o = order.slice(); [o[i - 1], o[i]] = [o[i], o[i - 1]]; this.setState({ order: o }); }
}));
return { t, contacts };
}
}
</script>
</body>
</html>
