<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar incidencia — fase 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px; border-bottom: 1px solid {{t.border}}">
    <a href="MovilFicha.dc.html" aria-label="Cancelar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <span style="font-size: 16px; font-weight: 600">Registrar incidencia</span>
    <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; margin-right: 6px; background: {{t.infoBg}}; color: {{t.infoFg}}">Fase 2</span>
  </header>

  <form style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px">
    <div style="display: flex; align-items: center; gap: 12px; border: 1px solid {{t.border}}; border-radius: 12px; padding: 10px 12px; background: {{t.card}}">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: {{t.secondary}}; color: {{t.secondaryFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">HB</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Héctor Benítez</span><span style="font-size: 13px; color: {{t.mutedFg}}">Hab. 7 · hoy 10:40</span></div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 8px">Tipo</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{types}}" as="x" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{x.pressed}}" onClick="{{x.pick}}" style="{{x.style}}">{{x.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="in-desc" style="font-size: 14px; font-weight: 500">Qué pasó</label>
      <textarea id="in-desc" rows="3" style="border: 1px solid {{t.border}}; border-radius: 10px; padding: 12px; font: 16px/1.4 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}; resize: none">Lo encontramos sentado en el piso del baño. Consciente, dice que se resbaló.</textarea>
    </div>

    <div style="display: flex; flex-direction: column; background: {{t.card}}; border: 1px solid {{t.border}}; border-radius: 12px">
      <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border-bottom: 1px solid {{t.border}}; font-size: 15px">Se avisó a la familia<input type="checkbox" role="switch" checked style="width: 44px; height: 26px; accent-color: {{t.primary}}; margin: 0"></label>
      <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; font-size: 15px">Lo evaluó un profesional<input type="checkbox" role="switch" style="width: 44px; height: 26px; accent-color: {{t.primary}}; margin: 0"></label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label for="in-resp" style="font-size: 14px; font-weight: 500">Responsable del seguimiento</label><select id="in-resp" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 10px; padding: 0 10px; font: 16px 'Geist', sans-serif; color: {{t.fg}}; background: {{t.card}}"><option>Laura Pereyra · Enfermería</option><option>Dra. Paula Giménez</option></select></div>
  </form>

  <footer style="padding: 12px 20px 20px; border-top: 1px solid {{t.border}}">
    <button type="button" style="width: 100%; height: 52px; border-radius: 12px; border: 0; background: {{t.primary}}; color: {{t.primaryFg}}; font: 600 16px 'Geist', sans-serif">Registrar incidencia</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { type: 'Caída' };
}
renderVals() {
const T = {
light: { bg: '#F7FAF9', fg: '#16201E', card: '#FFFFFF', mutedFg: '#57625F', border: '#DFE6E3', primary: '#145A52', primaryFg: '#FFFFFF', secondary: '#E8F1EE', secondaryFg: '#145A52', infoBg: '#EFF4FF', infoFg: '#1849A9' },
dark: { bg: '#0E1513', fg: '#E8EEEC', card: '#151E1B', mutedFg: '#9BA8A4', border: '#26332F', primary: '#3FB39F', primaryFg: '#06201C', secondary: '#183A34', secondaryFg: '#8FD9CB', infoBg: '#102A56', infoFg: '#84ADFF' }
};
const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
const base = 'height: 48px; border-radius: 10px; font: 500 15px Geist, sans-serif; ';
const types = ['Caída', 'Lesión o herida', 'Emergencia', 'Conducta', 'Extravío', 'Mantenimiento'].map((label) => ({
label,
pressed: this.state.type === label ? 'true' : 'false',
style: this.state.type === label ? base + 'border: 1.5px solid ' + t.primary + '; background: ' + t.secondary + '; color: ' + t.secondaryFg + ';' : base + 'border: 1px solid ' + t.border + '; background: ' + t.card + '; color: ' + t.fg + ';',
pick: () => this.setState({ type: label })
}));
return { t, types };
}
}
</script>
</body>
</html>
